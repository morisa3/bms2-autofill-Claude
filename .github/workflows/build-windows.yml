name: 建置 Windows 單一執行檔

# 只在需要正式封裝時手動執行（使用者指示：不要每次修改都打包）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 核心測試（不需瀏覽器）
        run: python -m pytest -q tests/test_prior_merge.py tests/test_synonyms.py tests/test_arch_components.py tests/test_fill.py tests/test_opinion.py

      - name: 打包成單一執行檔
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name BridgeFill
          --paths .
          --add-data "data/劣化說明與維修單價1123.xlsx;data"
          --collect-submodules bridgefill
          --collect-data docx
          packaging/entry.py

      - name: 自我測試（內嵌瀏覽器能啟動）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BridgeFill.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "dist\log\錯誤紀錄.txt") { Get-Content "dist\log\錯誤紀錄.txt" -Encoding utf8 }
            throw "自我測試失敗：$($p.ExitCode)"
          }

      - name: 讀取版本號
        shell: pwsh
        run: |
          $v = python -c "from bridgefill.version import VERSION; print(VERSION)"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 整理發佈檔案
        shell: pwsh
        run: |
          # 規則表、掃描檔（JSON）、比對輸出都是 exe 旁的獨立資料夾，不封裝在 exe 內；附上規則表供第一次使用
          New-Item -ItemType Directory -Force release\data | Out-Null
          Copy-Item "data\劣化說明與維修單價1123.xlsx" "release\data\" 
          Copy-Item "dist\BridgeFill.exe" "release\公路橋梁填報助手-v$env:APP_VERSION.exe"
          Copy-Item "docs\版本紀錄.md" "release\版本紀錄.md"
          Copy-Item "docs\操作說明.md" "release\操作說明.md"

      - uses: actions/upload-artifact@v4
        with:
          name: 公路橋梁填報助手-v${{ env.APP_VERSION }}
          path: release/
          retention-days: 30
